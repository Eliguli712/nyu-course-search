ingBuffer:","    def get(self, key):","        self._store.move_to_end(key); return self._store[key][0]","    def set(self, key, vec):","        ...; evict LRU when over capacity","","async def cached_embed(query, embed_fn):","    arr = buf.get(query)","    if arr is not None: return arr.tolist()         # L1 hit","    raw = await rds.get('vec:' + query)","    if raw is not None:                             # L2 hit","        arr = np.array(json.loads(raw)); buf.set(query, arr)","        return arr.tolist()","    vec = embed_fn([query])[0]                      # model compute","    buf.set(query, np.array(vec))","    await rds.set('vec:' + query, json.dumps(vec), ex=604800)","    return vec"];V["details.py"]=["# Semester backoff: Fall > Summer > Spring, newest year first","_SEASONS = ['Fall', 'Summer', 'Spring']","","def _term_sequence(max_terms=20):","    year = datetime.now(timezone.utc).year + 1   # look 1 year ahead","    count = 0","    while count < max_terms:","        for season in _SEASONS:","            yield season + ' ' + str(year)","            count += 1","        year -= 1","","async def resolve_course_details(course_code, rds):","    cached = await rds.get('details2:' + course_code.upper())","    if cached: return CourseDetails(**json.loads(cached))   # cache hit","","    for term in _term_sequence(max_terms=20):","        url     = class_search_url(course_code, term)","        snippet = _extract_snippet(await _fetch(url), course_code)","        if snippet:","            details = CourseDetails(found=True, url=url, term=term,","                                    snippet_html=snippet)","            await rds.set(key, json.dumps(asdict(details)), ex=604800)","            return details","","    return CourseDetails(found=False, url=fallback_url)   # cache miss"];V["scrape.py"]=["async def scrape_all_courses():","    async with httpx.AsyncClient(","        headers={'User-Agent': 'nyu-course-search/2.0'}","    ) as client:","        root  = await client
