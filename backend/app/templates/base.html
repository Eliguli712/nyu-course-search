<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "NYU Course Search" }}</title>

  <!-- No CDN frameworks. All styles are hand-written below. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

  <style>
    /* ─── Tokens ──────────────────────────────────────────────────────────── */
    :root {
      --bg:        #0b0f1a;
      --surface:   #111724;
      --raised:    #16202e;
      --border:    #1d2b42;
      --border-hi: #2a3d58;
      --amber:     #e8a830;
      --amber-lo:  #a87820;
      --chalk:     #ece8df;
      --muted:     #7a8599;
      --dim:       #3a4860;
      --violet:    #6b7fff;
      --green:     #4ecb8d;
      --red:       #e05c5c;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      --font-sans: 'Instrument Sans', system-ui, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

      --shadow-card: 0 2px 16px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.025) inset;
      --shadow-hover: 0 6px 28px rgba(0,0,0,0.55);
    }

    /* ─── Reset ───────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--chalk);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Diagonal grid watermark */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        repeating-linear-gradient(-52deg,
          transparent, transparent 44px,
          rgba(29,43,66,0.28) 44px, rgba(29,43,66,0.28) 45px);
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font-sans); cursor: pointer; }
    input, textarea { font-family: var(--font-sans); }

    /* ─── Layout ──────────────────────────────────────────────────────────── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ─── Header ──────────────────────────────────────────────────────────── */
    .site-header {
      position: relative; z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(11,15,26,0.93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .site-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      padding-bottom: 14px;
    }

    .logo {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.025em;
      color: var(--chalk);
    }
    .logo .sep { color: var(--amber); margin: 0 3px; }

    .nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      font-size: 0.82rem;
      color: var(--muted);
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--chalk); }

    .nav-email {
      font-size: 0.78rem;
      color: var(--dim);
      font-family: var(--font-mono);
    }

    /* ─── Main ────────────────────────────────────────────────────────────── */
    .site-main {
      position: relative; z-index: 1;
      padding: 40px 0 60px;
    }

    /* ─── Footer ──────────────────────────────────────────────────────────── */
    .site-footer {
      position: relative; z-index: 1;
      padding: 0 24px 40px;
      max-width: 900px;
      margin: 0 auto;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.07em;
      color: var(--dim);
    }

    /* ─── Card ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      box-shadow: var(--shadow-card);
    }

    /* ─── Headline ────────────────────────────────────────────────────────── */
    .headline {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }
    .headline em { font-style: italic; color: var(--amber); }

    .subheadline { font-size: 1.5rem; }

    /* ─── Search form ─────────────────────────────────────────────────────── */
    .search-form {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 22px;
    }

    .search-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--chalk);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus {
      border-color: var(--amber-lo);
      box-shadow: 0 0 0 3px rgba(232,168,48,0.1);
    }

    .btn-primary {
      background: var(--amber);
      color: #0b0f1a;
      font-weight: 600;
      font-size: 0.88rem;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 22px;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #f0b840; }
    .btn-primary:active { transform: scale(0.97); }

    /* ─── Ghost button ────────────────────────────────────────────────────── */
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 7px;
      padding: 4px 11px;
      font-size: 0.75rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .btn-ghost:hover {
      border-color: var(--border-hi);
      color: var(--chalk);
      background: rgba(255,255,255,0.04);
    }
    .btn-ghost.saved {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(232,168,48,0.08);
    }
    .btn-ghost.thumbed {
      border-color: var(--violet);
      color: var(--violet);
      background: rgba(107,127,255,0.08);
    }

    /* ─── Spinner ─────────────────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .spinner-sm { width: 12px; height: 12px; border-width: 1.5px; }

    .htmx-indicator { opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { opacity: 1; }

    /* ─── Results meta bar ────────────────────────────────────────────────── */
    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .results-meta strong { color: var(--amber); }

    /* ─── Score distribution chart ────────────────────────────────────────── */
    .score-chart-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px 10px;
      margin-bottom: 18px;
    }
    .score-chart-label {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.07em;
      color: var(--dim);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .score-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 40px;
    }
    .score-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      cursor: pointer;
      position: relative;
    }
    .score-bar-col:hover .score-bar-fill { opacity: 1; }
    .score-bar-fill {
      width: 100%;
      border-radius: 2px 2px 0 0;
      background: var(--amber);
      opacity: 0.6;
      transition: opacity 0.15s, height 0.4s ease;
      min-height: 2px;
    }
    .score-bar-col.highlighted .score-bar-fill { opacity: 1; background: var(--amber); }

    /* ─── Course card ─────────────────────────────────────────────────────── */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .course-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px 14px 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    /* Left accent stripe */
    .course-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--border);
      transition: background 0.2s;
    }
    .course-card:hover {
      border-color: rgba(232,168,48,0.3);
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }
    .course-card:hover::before { background: var(--amber); }

    /* Card entrance animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    .course-card {
      animation: fadeUp 0.28s ease both;
      opacity: 0;
    }
    /* stagger via inline style --i */
    .course-card { animation-delay: calc(var(--i, 0) * 0.045s); }

    /* Card header row */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-meta { flex: 1; min-width: 0; }

    .course-code {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--amber);
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .course-name {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--chalk);
      margin-top: 2px;
    }

    /* Relevance score badge + bar */
    .score-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }
    .score-badge {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .score-badge strong { color: var(--chalk); }

    .score-track {
      flex: 1;
      max-width: 180px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
      /* colour set inline */
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .course-desc {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.65;
      margin-top: 8px;
    }

    /* Keyword highlight injected by JS */
    .course-desc mark {
      background: rgba(232,168,48,0.22);
      color: var(--chalk);
      border-radius: 2px;
      padding: 0 2px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .text-link {
      font-size: 0.77rem;
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
      transition: color 0.15s, text-decoration-color 0.15s;
      background: none;
      border: none;
      padding: 0;
    }
    .text-link:hover {
      color: var(--chalk);
      text-decoration-color: var(--amber-lo);
    }

    /* ─── Details panel ───────────────────────────────────────────────────── */
    .details-panel {
      background: rgba(11,15,26,0.65);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.8rem;
      margin-top: 10px;
      color: var(--muted);
    }
    .details-panel .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-label {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--chalk);
    }

    /* ─── Auth forms ──────────────────────────────────────────────────────── */
    .auth-wrap {
      max-width: 380px;
      margin: 48px auto 0;
    }

    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field-input {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      color: var(--chalk);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field-input::placeholder { color: var(--muted); }
    .field-input:focus {
      border-color: var(--amber-lo);
      box-shadow: 0 0 0 3px rgba(232,168,48,0.1);
    }

    .form-stack { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
    .btn-full { display: block; width: 100%; text-align: center; }

    .alert-error {
      margin-top: 14px;
      padding: 9px 13px;
      background: rgba(224,92,92,0.1);
      border: 1px solid rgba(224,92,92,0.3);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: #e07878;
    }

    /* ─── Saved page ──────────────────────────────────────────────────────── */
    .page-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    /* ─── Empty state ─────────────────────────────────────────────────────── */
    .empty-state {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: var(--dim);
      padding: 12px 0;
    }

    /* ─── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">NYU<span class="sep">·</span>Course<span class="sep" style="color:var(--chalk)">Search</span></a>
      {% if user %}
      <nav class="nav">
        <a href="/saved" class="nav-link">Saved</a>
        <span class="nav-email">{{ user.email }}</span>
        <form method="post" action="/logout" style="margin:0">
          <button class="btn-ghost">Log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    DATA · BULLETINS.NYU.EDU &nbsp;·&nbsp; SEMANTIC SEARCH + CHEBYSHEV T₁–T₄ PCCA RERANKING
  </footer>
</body>
</html>
